name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files need formatting (run 'gofmt -w .' locally):"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install shadow analyzer
        run: go install golang.org/x/tools/go/analysis/passes/shadow/cmd/shadow@latest

      - name: Vet (shadow)
        run: go vet -vettool=$(go env GOPATH)/bin/shadow ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Build
        run: go build ./...

      - name: Module hygiene
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git diff go.mod go.sum 2>/dev/null || true
            echo "go.mod or go.sum changed. Run 'go mod tidy' locally and commit the result."
            exit 1
          fi
